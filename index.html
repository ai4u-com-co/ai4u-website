<!DOCTYPE html>
<html lang="es-CO">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
    
    <!-- Viewport optimizado para móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- Content Security Policy básico -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests; default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://connect.facebook.net https://translate.google.com https://translate.googleapis.com https://translate-pa.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://translate.googleapis.com https://www.gstatic.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.google.com https://www.googletagmanager.com https://www.facebook.com https://connect.facebook.net https://translate.googleapis.com https://translate.google.com https://translate-pa.googleapis.com; frame-src 'self' https://translate.google.com https://translate.googleapis.com;" />
    <!-- Meta tags básicos: título, descripción, canónica, Open Graph, Twitter y datos estructurados los pone SEOHead en cada página (src/components/shared/ui/atoms/SEOHead.tsx) -->
    <script>
      // Preferencias de lectura (panel de accesibilidad): se aplican antes de pintar para que no parpadee al recargar.
      try {
        var a11y = JSON.parse(localStorage.getItem('ai4u-a11y') || 'null') || {};
        var h = document.documentElement;
        if (a11y.texto === 125 || a11y.texto === 150) h.setAttribute('data-a11y-texto', String(a11y.texto));
        ['contraste', 'espaciado', 'fuente', 'movimiento', 'facil'].forEach(function (k) { if (a11y[k] === true) h.setAttribute('data-a11y-' + k, ''); });
      } catch (e) {}
    </script>
    <title>Ai4U: agentes de IA, dashboards y software a la medida</title>
    <meta name="author" content="Ai4U" />
    
    <!-- Meta tags para PWA -->
    <meta name="theme-color" content="#e5e4e0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AI4U" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="msapplication-TileColor" content="#e5e4e0" />
    <meta name="msapplication-tap-highlight" content="no" />
    
    <!-- Iconos para diferentes dispositivos -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Preconnect para fuentes y recursos externos -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    
    <!-- Fuentes: carga sin bloquear el primer pintado (display=swap) -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@300;400;500;600;700;900&family=Fira+Mono:wght@400;500&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@300;400;500;600;700;900&family=Fira+Mono:wght@400;500&display=swap"></noscript>
    <link rel="preload" href="/fonts/NectoMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
    
    <!-- Analítica y publicidad (Google Analytics + píxel de Meta): NADA se descarga hasta que la persona acepta en el banner de cookies
         (Ley 1581 de 2012: autorización previa). window.__ai4uLoadTrackers es la única puerta; la llama src/utils/consent.ts al aceptar,
         o esta misma página cuando ya había aceptado en una visita anterior. Antes de aceptar, gtag y fbq existen pero descartan todo,
         así el código de React puede llamarlos sin comprobar nada. Se pide después de la carga para no competir con el CSS crítico. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){ if (window.__ai4uTrackersLoaded) dataLayer.push(arguments); }
      !function(f,n){if(f.fbq)return;n=f.fbq=function(){ if(!f.__ai4uTrackersLoaded) return; n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
      n.push=n;n.loaded=!0;n.version='2.0';n.queue=[]}(window);
      window.__ai4uLoadTrackers = function () {
        // El prerender del build corre en Chromium automatizado (webdriver): no debe mandar visitas falsas.
        if (window.__ai4uTrackersLoaded || navigator.webdriver) return;
        window.__ai4uTrackersLoaded = true;
        gtag('js', new Date());
        gtag('config', 'G-44D5SE9KCR', { page_location: window.location.href });
        fbq('init', '2098400163896719');
        fbq('track', 'PageView');
        ['https://www.googletagmanager.com/gtag/js?id=G-44D5SE9KCR', 'https://connect.facebook.net/en_US/fbevents.js'].forEach(function (src) {
          var t = document.createElement('script');
          t.async = true;
          t.src = src;
          document.head.appendChild(t);
        });
      };
      (function () {
        var granted = false;
        try { var c = JSON.parse(localStorage.getItem('ai4u_consent_v1') || 'null'); granted = !!c && c.choice === 'granted'; } catch (e) {}
        if (!granted) return;
        window.addEventListener('load', function () {
          if ('requestIdleCallback' in window) requestIdleCallback(window.__ai4uLoadTrackers, { timeout: 4000 }); else setTimeout(window.__ai4uLoadTrackers, 2000);
        });
      })();
    </script>
  </head>
  <body>
    <noscript>Necesitas habilitar JavaScript para ejecutar esta aplicación.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
