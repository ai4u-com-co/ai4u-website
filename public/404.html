<!DOCTYPE html>
<html lang="es-CO">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Página no encontrada | Ai4U</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <style>
      :root { --canvas: #e5e4e0; --ink: #1d1d1d; --ash: #bfbebe; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--canvas); color: var(--ink); font-family: 'Red Hat Display', 'Helvetica Neue', Arial, sans-serif; line-height: 1.45; }
      main { width: 100%; max-width: 760px; padding: 48px 24px; }
      .cap { font: 400 12px/1.4 'Fira Mono', 'Courier New', monospace; letter-spacing: .05em; text-transform: uppercase; margin: 0 0 24px; }
      h1 { font-weight: 500; text-transform: uppercase; font-size: clamp(40px, 9vw, 88px); line-height: .9; margin: 0 0 24px; letter-spacing: .013em; }
      p { margin: 0 0 28px; font-size: 18px; max-width: 46ch; }
      nav { display: flex; flex-wrap: wrap; gap: 4px 28px; border-top: 1px solid var(--ash); padding-top: 20px; }
      a { color: inherit; font-weight: 500; text-transform: uppercase; letter-spacing: .02em; font-size: 15px; text-decoration: none; min-height: 44px; display: inline-flex; align-items: center; }
      a:hover, a:focus-visible { text-decoration: underline; text-underline-offset: 5px; }
    </style>
  </head>
  <body>
    <main>
      <p class="cap">Ai4U · Error 404</p>
      <h1>Esta página<br>no existe</h1>
      <p>Puede que el enlace haya cambiado. Estos son los lugares desde donde puedes seguir.</p>
      <nav aria-label="Páginas principales">
        <a href="/">Inicio →</a>
        <a href="/agentes">Agentes →</a>
        <a href="/dashboards">Dashboards →</a>
        <a href="/servicios">A tu medida →</a>
        <a href="/sitios-web">Sitios web →</a>
        <a href="/preguntas-frecuentes">Preguntas frecuentes →</a>
      </nav>
    </main>
  </body>
</html>
